name: Monorepo CI Quality Gates

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master, dev ]

jobs:
  verify:
    name: Typecheck, Lint, Test, Contract & Validate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: campus_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/campus_db?schema=public"
      JWT_SECRET: "ci-super-secret-jwt-key-min-32-chars-long"
      PORT: 3000
      NODE_ENV: test
      ENABLE_SWAGGER: "true"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.7.0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Dependencies
        run: pnpm install

      - name: Start Live Backend Server
        run: |
          cd backend
          bun install
          bunx prisma migrate deploy
          bun run src/index.ts &
          sleep 5
          curl -f http://localhost:3000/swagger/json || exit 1

      - name: Sync OpenAPI Spec Live
        run: pnpm api:sync

      - name: Run Full Monorepo Verification (verify script)
        run: pnpm run verify

